<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css-warmup-4</title>
    <style>
        #phone-msg
        {
            display: none;
        }
        @media (max-width: 600px)
        {
            #phone-msg
            {
                display: block;
            }
        }
    </style>
</head>
<body>
    <p id="phone-msg">You are on a small screen</p>
</body>
</html>
